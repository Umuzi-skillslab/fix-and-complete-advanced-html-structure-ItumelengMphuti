<!doctype html>
<html>
  <head>
    <title>Contact</title>
    <link rel="stylesheet" href="styles.css" />
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

  </head>
  <body>
    <header class="top">
      <h1><a href="index.html">Media Production Company</a></h1>

      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="media.html">Media</a>
        <!-- <a href="contact.html">Contact</a> -->
      </nav>
    </header>

    <main class="page contact-layout">
      <h2>Get In Touch</h2>

      <div class="social-icons">
    <a href="#" class="icon facebook"><i class="fab fa-facebook-f"></i></a>
    <a href="#" class="icon twitter"><i class="fab fa-twitter"></i></a>
    <a href="#" class="icon instagram"><i class="fab fa-instagram"></i></a>
    <a href="#" class="icon linkedin"><i class="fab fa-linkedin-in"></i></a>
  </div>

      <!-- Form with multiple errors -->
      <form class="contact-form">
        <fieldset>
          <legend>Contact Information</legend>

          <label for="name">Name:</label>
          <input type="text" id="name" required />

          <label for="email">Email:</label>
          <input type="email" id="email" required />

          <label for="phone">Phone:</label>
          <input type="tel" id="phone" />

          <label for="date">Preferred Date:</label>
          <input type="date" id="date" />
        </fieldset>

        <fieldset>
          <legend>Service Type</legend>

          <label> <input type="radio" name="service" /> Video </label>

          <label> <input type="radio" name="service" /> Audio </label>
        </fieldset>

        <fieldset>
          <legend>Extras</legend>

          <label> <input type="checkbox" /> Editing </label>

          <label> <input type="checkbox" /> Scriptwriting </label>
        </fieldset>

        <label for="message">Message:</label>
        <textarea id="message" required></textarea>

        <button class="btn">Send</button>
      </form>
    </main>

    <footer class="footer">
      <div class="footer-left">
        <h3><a href="index.html">Media Production Co.</a></h3>
      </div>
      <div class="footer-right">
        <p>© 2026 Media Production. All rights reserved.</p>
      </div>
    </footer>
  </body>
</html>
